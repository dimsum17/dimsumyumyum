name: New Visit
description: Log a new restaurant visit
title: "[visit] "
labels: ["visit"]
body:
  - type: input
    id: date
    attributes:
      label: Date
      description: Type it however feels natural, e.g. November 1, 2025
      placeholder: "November 1, 2025"
    validations:
      required: true

  - type: input
    id: restaurant
    attributes:
      label: Restaurant name
    validations:
      required: true

  - type: input
    id: address
    attributes:
      label: Address
      description: Full address, or a cross street if that's all you remember. The map pin is placed automatically — no coordinates needed.
      placeholder: "1495 W Broadway, Vancouver, BC"
    validations:
      required: true

  - type: textarea
    id: dishes
    attributes:
      label: Dishes
      description: >
        One dish per block. Type the dish name, paste its photo, and write what
        you thought — in any order that feels natural. Leave a blank line, then
        start the next dish the same way. Add as many as you tried.
      placeholder: |
        Har Gow
        [paste photo here]
        Wrappers were thin, didn't tear. Best I've had this year.

        Char Siu Bao
        [paste photo here]
        A touch too sweet for me, but the table loved it.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: The verdict
      description: Your overall take — vibe, service, would you go back. Be honest.
    validations:
      required: false
