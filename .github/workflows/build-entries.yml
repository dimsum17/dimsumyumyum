name: Add visit to blog

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue, geocode address, update entries.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || "";

            // Only process issues that actually came from the New Visit form —
            // detected by the presence of this field, not by a label.
            if (!body.includes("### Restaurant name")) {
              console.log("Not a visit submission, skipping.");
              return;
            }

            function field(label) {
              const re = new RegExp(`### ${label}\\s*\\n\\s*([\\s\\S]*?)(?=\\n### |$)`, "i");
              const m = body.match(re);
              if (!m) return "";
              const val = m[1].trim();
              return val === "_No response_" ? "" : val;
            }

            const date = field("Date");
            const restaurant = field("Restaurant name");
            const address = field("Address");
            const dishesRaw = field("Dishes");
            const notes = field("The verdict");

            const blocks = dishesRaw.split(/\n\s*\n+/).map(b => b.trim()).filter(Boolean);
            const dishes = blocks.map(block => {
              const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
              const name = lines[0] || "Untitled dish";
              const rest = lines.slice(1);
              const images = [];
              const textLines = [];
              rest.forEach(line => {
                const imgMatches = [...line.matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)];
                if (imgMatches.length) {
                  imgMatches.forEach(m => images.push(m[1]));
                } else {
                  textLines.push(line);
                }
              });
              return { name, thoughts: textLines.join(" ").trim(), images };
            });

            let lat = null, lng = null;
            if (address) {
              try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`;
                const res = await fetch(url, {
                  headers: { "User-Agent": "personal-food-blog-bot/1.0 (github actions)" }
                });
                const data = await res.json();
                if (data && data[0]) {
                  lat = parseFloat(data[0].lat);
                  lng = parseFloat(data[0].lon);
                }
              } catch (err) {
                console.log("Geocoding failed:", err.message);
              }
            }

            const entriesPath = "entries.json";
            let entries = [];
            if (fs.existsSync(entriesPath)) {
              entries = JSON.parse(fs.readFileSync(entriesPath, "utf8"));
            }

            const id = `issue-${context.payload.issue.number}`;
            const newEntry = { id, date, restaurant, address, lat, lng, dishes, notes };
            const existingIdx = entries.findIndex(e => e.id === id);
            if (existingIdx >= 0) {
              entries[existingIdx] = newEntry;
            } else {
              entries.push(newEntry);
            }

            entries.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
            fs.writeFileSync(entriesPath, JSON.stringify(entries, null, 2) + "\n");

            if (!lat && address) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: "Heads up — I couldn't find that address on the map, so this entry was added without a pin. Edit this issue with a more specific address to try again."
              });
            }

      - name: Commit and push
        run: |
          git config user.name "food-blog-bot"
          git config user.email "actions@github.com"
          git add entries.json
          git diff --staged --quiet || git commit -m "Add/update entry from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        if: contains(github.event.issue.body, '### Restaurant name')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: "closed"
            });
