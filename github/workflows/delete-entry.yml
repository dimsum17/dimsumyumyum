name: Delete visit from blog

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  delete-entry:
    if: github.event.label.name == 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove entry from entries.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const entriesPath = "entries.json";
            let entries = [];
            if (fs.existsSync(entriesPath)) {
              entries = JSON.parse(fs.readFileSync(entriesPath, "utf8"));
            }
            const id = `issue-${context.payload.issue.number}`;
            const before = entries.length;
            entries = entries.filter(e => e.id !== id);
            fs.writeFileSync(entriesPath, JSON.stringify(entries, null, 2) + "\n");
            const removed = before !== entries.length;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: removed ? "Removed from the site." : "Couldn't find a matching entry (maybe already removed)."
            });

      - name: Commit and push
        run: |
          git config user.name "food-blog-bot"
          git config user.email "actions@github.com"
          git add entries.json
          git diff --staged --quiet || git commit -m "Remove entry from issue #${{ github.event.issue.number }}"
          git push
