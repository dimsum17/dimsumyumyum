<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dim Sum Yum Yum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --paper: #FAF6F0;
    --card: #FFFDF9;
    --ink: #26231F;
    --rule: #E1D8C8;
    --accent: #A6543C;
    --muted: #8A8275;
    --danger-bg: #F5DCD8;
    --danger-text: #7A2020;
    --danger-border: #B85C4F;
    --gold-bg: #FCEFD1;
    --gold-text: #8A5A12;
    --gold-border: #C08A34;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 56px 24px 28px;
    text-align: center;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    margin: 0;
    letter-spacing: 0.3px;
  }

  header p {
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--muted);
    margin: 10px 0 0;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 36px;
  }

  nav button {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 20px;
  }

  nav button.active {
    background: var(--ink);
    color: var(--paper);
  }

  main { max-width: 800px; margin: 0 auto; padding: 0 20px 90px; }

  .view { display: none; }
  .view.active { display: block; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
