<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dim Sum Yum Yum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --paper: #FAF6F0;
    --card: #FFFDF9;
    --ink: #26231F;
    --rule: #E1D8C8;
    --accent: #A6543C;
    --muted: #8A8275;
    --danger-bg: #F5DCD8;
    --danger-text: #7A2020;
    --danger-border: #B85C4F;
    --gold-bg: #FCEFD1;
    --gold-text: #8A5A12;
    --gold-border: #C08A34;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 56px 24px 28px;
    text-align: center;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    margin: 0;
    letter-spacing: 0.3px;
  }

   header p {
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--muted);
    margin: 10px 0 0;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 36px;
  }

  nav button {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 20px;
  }

  nav button.active {
    background: var(--ink);
    color: var(--paper);
  }

  main { max-width: 800px; margin: 0 auto; padding: 0 20px 90px; }

  .view { display: none; }
  .view.active { display: block; }

  .sort-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
  }

  .sort-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .sort-btn {
    font-family: 'Work Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    padding: 5px 14px;
    border-radius: 14px;
    cursor: pointer;
  }

  .sort-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .entry {
    padding: 36px 0;
    border-bottom: 1px solid var(--rule);
  }
  .entry:first-child { padding-top: 0; }

  .entry-top { margin-bottom: 20px; }

  .entry-restaurant {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.6rem;
    margin: 0 0 4px;
  }

  .entry-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .rating {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--rule);
    color: var(--accent);
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  .rating-0 {
    border-color: var(--danger-border);
    background: var(--danger-bg);
    color: var(--danger-text);
    font-weight: 600;
  }

  .rating-6 {
    border-color: var(--gold-border);
    background: linear-gradient(135deg, var(--gold-bg), #F3DBA0);
    color: var(--gold-text);
    font-weight: 600;
  }

  .dishes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    margin-bottom: 22px;
  }

  .dish-card {
    display: flex;
    flex-direction: column;
  }

  .dish-photo {
    aspect-ratio: 1 / 1;
    width: 100%;
    object-fit: cover;
    border-radius: 8px;
    background: var(--card);
    box-shadow: 0 1px 3px rgba(38,35,31,0.12);
  }

  .dish-photo-placeholder {
    aspect-ratio: 1 / 1;
    width: 100%;
    border-radius: 8px;
    background: linear-gradient(135deg, #F1E8DA, #E7DAC4);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    color: #6b5f4a;
    box-shadow: 0 1px 3px rgba(38,35,31,0.08);
  }

  .dish-extra-thumbs {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .dish-extra-thumbs img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 4px;
  }

  .dish-name {
    font-weight: 600;
    font-size: 0.98rem;
    margin-top: 10px;
  }

  .dish-thoughts {
    font-size: 0.9rem;
    color: #4a463f;
    margin-top: 3px;
    line-height: 1.45;
  }

  .verdict {
    margin: 0;
    padding-left: 16px;
    border-left: 2px solid var(--accent);
  }

  .verdict-label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .verdict-text {
    font-size: 0.97rem;
    line-height: 1.6;
    color: #3a362f;
    font-style: italic;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }

  #map { height: 560px; border-radius: 6px; overflow: hidden; }

  .leaflet-popup-content-wrapper {
    background: var(--paper);
    border-radius: 4px;
    font-family: 'Work Sans', sans-serif;
  }
  .popup-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.02rem; margin: 0 0 4px; }
  .popup-meta { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Dim Sum Yum Yum</h1>
  <p>Just a boi's thoughts</p>
</header>

<nav>
  <button id="btn-feed" class="active">Reviews</button>
  <button id="btn-map">Map</button>
</nav>

<main>
  <section id="view-feed" class="view active">
    <div class="sort-bar">
      <span class="sort-label">Sort by</span>
      <button id="sort-date" class="sort-btn active">Date</button>
      <button id="sort-rating" class="sort-btn">Rating</button>
    </div>
    <div id="entries-list"></div>
  </section>
  <section id="view-map" class="view">
    <div id="map"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  let entries = [];
  let map, markerLayer;
  let currentSort = 'date';

  function sortKey(dateStr) {
    if (!dateStr) return "";
    const t = Date.parse(dateStr);
    if (!isNaN(t)) return new Date(t).toISOString().slice(0, 10);
    return dateStr;
  }

  function displayDate(dateStr) {
    if (!dateStr) return "";
    const isIso = /^\d{4}-\d{2}-\d{2}$/.test(dateStr.trim());
    if (isIso) {
      const dt = new Date(dateStr + "T00:00:00");
      if (!isNaN(dt)) {
        return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      }
    }
    return dateStr;
  }

  function starString(r, max = 6) {
    return '★'.repeat(r) + '☆'.repeat(max - r);
  }

   function ratingBadge(r) {
    if (typeof r !== 'number' || isNaN(r)) return '';
    if (r === 0) return `<span class="rating rating-0">✕</span>`;
    if (r === 6) return `<span class="rating rating-6">${starString(6)}</span>`;
    return `<span class="rating">${starString(r)}</span>`;
  }

  function renderDish(d) {
    const hasPhoto = d.images && d.images.length > 0;
    const mainPhoto = hasPhoto
      ? `<img class="dish-photo" src="${d.images[0]}" loading="lazy">`
      : `<div class="dish-photo-placeholder">${escapeHtml(d.name)}</div>`;
    const extra = hasPhoto && d.images.length > 1
      ? `<div class="dish-extra-thumbs">${d.images.slice(1, 4).map(src => `<img src="${src}" loading="lazy">`).join('')}</div>`
      : '';
    return `
      <div class="dish-card">
        ${mainPhoto}
        ${extra}
        <div class="dish-name">${escapeHtml(d.name)}</div>
        ${d.thoughts ? `<div class="dish-thoughts">${escapeHtml(d.thoughts)}</div>` : ''}
      </div>
    `;
  }

  function renderFeed() {
    const el = document.getElementById('entries-list');
    if (!entries.length) {
      el.innerHTML = `<div class="empty">No visits logged yet.</div>`;
      return;
    }
    const sorted = [...entries].sort((a, b) => {
      if (currentSort === 'rating') {
        const ra = typeof a.rating === 'number' ? a.rating : -1;
        const rb = typeof b.rating === 'number' ? b.rating : -1;
        if (rb !== ra) return rb - ra;
        return sortKey(b.date).localeCompare(sortKey(a.date));
      }
      return sortKey(b.date).localeCompare(sortKey(a.date));
    });
    el.innerHTML = sorted.map(e => `
      <article class="entry">
        <div class="entry-top">
          <p class="entry-restaurant">${escapeHtml(e.restaurant || "Unnamed spot")}</p>
          <p class="entry-meta">${displayDate(e.date)}${e.address ? ' · ' + escapeHtml(e.address) : ''}</p>
          ${ratingBadge(e.rating)}
        </div>
        ${e.dishes && e.dishes.length ? `<div class="dishes-grid">${e.dishes.map(renderDish).join('')}</div>` : ''}
        ${e.notes ? `
          <div class="verdict">
            <span class="verdict-label">THE VERDICT</span>
            <p class="verdict-text">${escapeHtml(e.notes)}</p>
          </div>
        ` : ''}
      </article>
    `).join('');
  }

  function renderMap() {
    if (!map) {
      map = L.map('map').setView([49.2608, -123.1139], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);
    }
    markerLayer.clearLayers();
    const pts = entries.filter(e => e.lat && e.lng);
    pts.forEach(e => {
      const m = L.circleMarker([e.lat, e.lng], {
        radius: 7,
        color: '#26231F',
        weight: 1.5,
        fillColor: '#A6543C',
        fillOpacity: 0.85
      }).addTo(markerLayer);
      m.bindPopup(`<p class="popup-title">${escapeHtml(e.restaurant || "Unnamed spot")}</p><p class="popup-meta">${displayDate(e.date)}</p>`);
    });
    if (pts.length) {
      const bounds = L.latLngBounds(pts.map(e => [e.lat, e.lng]));
      map.fitBounds(bounds.pad(0.2));
    }
    setTimeout(() => map.invalidateSize(), 50);
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById('btn-feed').addEventListener('click', () => switchView('feed'));
  document.getElementById('btn-map').addEventListener('click', () => switchView('map'));
  document.getElementById('sort-date').addEventListener('click', () => setSort('date'));
  document.getElementById('sort-rating').addEventListener('click', () => setSort('rating'));

  function setSort(mode) {
    currentSort = mode;
    document.getElementById('sort-date').classList.toggle('active', mode === 'date');
    document.getElementById('sort-rating').classList.toggle('active', mode === 'rating');
    renderFeed();
  }

  function switchView(name) {
    document.getElementById('view-feed').classList.toggle('active', name === 'feed');
    document.getElementById('view-map').classList.toggle('active', name === 'map');
    document.getElementById('btn-feed').classList.toggle('active', name === 'feed');
    document.getElementById('btn-map').classList.toggle('active', name === 'map');
    if (name === 'map') renderMap();
  }

  fetch('entries.json')
    .then(r => r.json())
    .then(data => {
      entries = data;
      renderFeed();
    })
    .catch(() => {
      document.getElementById('entries-list').innerHTML = `<div class="empty">Couldn't load entries.json</div>`;
    });
</script>

</body>
</html>
